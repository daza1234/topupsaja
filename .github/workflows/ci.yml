name: CI

on:
  push:
    branches: [main]
    paths: ['cli/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['cli/**', '.github/workflows/ci.yml']

defaults:
  run:
    working-directory: cli

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
